name: Poll Banco Compartilhado

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 minutos
  workflow_dispatch:          # permite rodar manualmente também

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar banco e processar mensagens
        env:
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
        run: node scripts/poll-db.js

      - name: Ping Render (manter API PAP viva)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://site-st.onrender.com/api/healthz")
          echo "Render API status: $STATUS"
        continue-on-error: true

  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Roundtable — sistemas se acordando
        run: |
          BASE="https://site-st.onrender.com/api"

          # 1. Acorda o Render e registra presença no roundtable
          PING=$(curl -s --max-time 30 "$BASE/sistemas/ping?from=github-actions")
          echo "roundtable: $PING"

          # 2. Verifica healthz geral
          HEALTH=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/healthz")
          echo "healthz: $HEALTH"

          # 3. Verifica rapadura (endpoint de auth/me — deve retornar 401, não 500)
          RAP=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 "$BASE/rapadura/auth/me")
          echo "rapadura/auth/me: $RAP"

          # 4. Verifica frontend Vercel
          FRONT=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://site-st.vercel.app/rapadura")
          echo "vercel/rapadura: $FRONT"

          # Falha se Render retornar erro 5xx
          if [ "$HEALTH" -ge 500 ]; then
            echo "ERRO: Render retornou $HEALTH"
            exit 1
          fi
        continue-on-error: true
