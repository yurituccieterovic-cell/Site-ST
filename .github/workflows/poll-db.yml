name: Poll Banco Compartilhado

on:
  schedule:
    - cron: '*/5 * * * *'   # a cada 5 minutos
  workflow_dispatch:          # permite rodar manualmente também

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Verificar banco e processar mensagens
        env:
          DB_API_KEY: ${{ secrets.DB_API_KEY }}
        run: node scripts/poll-db.js

      - name: Ping Render (manter API PAP viva)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://site-st.onrender.com/api/healthz")
          echo "Render API status: $STATUS"
        continue-on-error: true

  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Keep-alive Render (sem checkout)
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
            "https://site-st.onrender.com/api/healthz")
          echo "healthz: $STATUS"
          FRONT=$(curl -s -o /dev/null -w "%{http_code}" --max-time 20 \
            "https://site-st.vercel.app/aliancapanorama")
          echo "front: $FRONT"
