name: Keep-Alive Render

on:
  schedule:
    # GitHub throttles scheduled workflows — use cron-job.org for reliable 10-min pings
    # These fire on deploys + occasional schedule as backup
    - cron: "*/10 * * * *"
    - cron: "5-59/10 * * * *"
    - cron: "2-58/10 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API + Age warm-up
        run: |
          echo "Trigger: ${{ github.event_name }}"
          # Primeiro ping com timeout longo (cold start pode levar 90s)
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://site-st.onrender.com/api/healthz)
          echo "healthz: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Dormindo ($STATUS) — aguardando 30s e tentando de novo"
            sleep 30
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://site-st.onrender.com/api/healthz)
            echo "healthz (retry): $STATUS"
          fi
          # Aquece rotas Age em paralelo
          curl -s -o /dev/null --max-time 30 https://site-st.onrender.com/api/age/lisange || true
          curl -s -o /dev/null --max-time 30 https://site-st.onrender.com/api/age/susana  || true
          echo "Warm-up completo: healthz=$STATUS"
