name: Keep-Alive Render

on:
  schedule:
    - cron: "*/10 * * * *"   # a cada 10 minutos
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 60 https://site-st.onrender.com/api/healthz)
          echo "healthz: $STATUS"
          if [ "$STATUS" != "200" ]; then
            echo "Servidor respondeu $STATUS — pode estar acordando."
            # Tenta o age/lisange para acelerar warm-up das queries
            curl -s -o /dev/null --max-time 60 https://site-st.onrender.com/api/age/lisange || true
          fi
