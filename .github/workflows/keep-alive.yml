name: Keep-Alive Render

on:
  schedule:
    - cron: "*/5 * * * *"   # a cada 5 minutos (mínimo GitHub Actions)
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API + Age warm-up
        run: |
          STATUS=$(curl -s -o /dev/null -w "%{http_code}" --max-time 90 https://site-st.onrender.com/api/healthz)
          echo "healthz: $STATUS"
          # Sempre aquece as rotas Age (não só quando falha) — são as que dormem primeiro
          curl -s -o /dev/null --max-time 90 https://site-st.onrender.com/api/age/lisange || true
          curl -s -o /dev/null --max-time 60 https://site-st.onrender.com/api/age/susana  || true
          if [ "$STATUS" != "200" ]; then
            echo "Servidor estava dormindo ($STATUS) — acordando com warm-up completo"
            sleep 5
            curl -s -o /dev/null --max-time 60 https://site-st.onrender.com/api/healthz || true
          fi
